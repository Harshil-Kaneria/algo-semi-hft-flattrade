name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Pull latest code on server
    runs-on: ubuntu-latest

    steps:
      - name: SSH into server and git pull
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.SERVER_REPO_PATH }}
            git pull origin main
            echo "✅ Deployed at $(date '+%Y-%m-%d %H:%M:%S')"

            # Optional: restart the trader process if it is running under systemd
            # Uncomment the line below if you set up trader.service on the server
            # sudo systemctl restart trader
