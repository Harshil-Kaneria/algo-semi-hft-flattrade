name: Deploy to Server

# Triggers on every push to main
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH into server and git pull
    runs-on: ubuntu-latest   # GitHub's free runner — no server needed for CI itself

    steps:
      - name: Deploy latest main to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            echo "Deployed $(git rev-parse --short HEAD) at $(date '+%Y-%m-%d %H:%M:%S')"

            # Optional — uncomment to restart the trader systemd service:
            # sudo systemctl restart trader
